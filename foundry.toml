[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc = ".toolchain/bin/solc"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
gas_limit = 10000000000
code_size_limit = 1000000
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./artifacts/local/wad" }]

[fmt]
line_length = 110

[fuzz]
runs = 256
